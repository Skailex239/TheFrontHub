name: Auto Sync

# ─────────────────────────────────────────────────────────────────────────────
# ⚡ UNIFIED SYNC PIPELINE — All 6 syncs in PARALLEL + retrigger at the end
#
# Each sync writes to DIFFERENT files → no file conflicts:
#   - sync-standard     → runs.json.gz, seen.json, checkpoint.json
#   - sync-compact      → runs_compact.json.gz, seen_compact.json
#   - sync-teams        → teams_runs.json, teams_seen.json
#   - sync-ranked       → ranked.json, ranked_history.json
#   - sync-dashboard    → dashboard_scores.json
#   - sync-player-games → player-data/, player-stats/
#
# All 6 run in PARALLEL (no needs: between them). Git push conflicts are
# handled by the retry loop (git pull --rebase --autostash, 5 attempts).
#
# The retrigger job waits for ALL 6 to finish, then re-dispatches the workflow.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-sync-v2
  cancel-in-progress: true  # Annule les runs en attente (mais pas ceux déjà démarrés)

jobs:
  sync-standard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y --silent && npm install node-fetch@2 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync.js
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
          SYNC_HISTORY_WINDOWS: "500"
      - name: Commit et push (standard)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in runs_public.json.gz runs.json.gz clans.json clans.json.gz news.json news.json.gz seen.json checkpoint.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "no changes standard"; exit 0; }
          git commit -m "[auto] sync"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  sync-compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y --silent && npm install node-fetch@2 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync.js --mode=compact
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
          COMPACT_HISTORY_WINDOWS: "500"
      - name: Commit et push (compact)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in runs_compact_public.json.gz runs_compact.json.gz seen_compact.json checkpoint_compact.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "no changes compact"; exit 0; }
          git commit -m "[auto] sync compact"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  sync-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y --silent && npm install node-fetch@2 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync-teams.js
      - name: Cleanup teams data
        run: node scripts/cleanup-teams.js || true
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Commit et push (teams)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in teams_runs.json teams_runs.json.gz teams_seen.json teams_checkpoint.json teams_public.json teams_public.json.gz; do
            [ -f "$f" ] && git add "$f" -f
          done
          git diff --cached --quiet && { echo "no changes teams"; exit 0; }
          git commit -m "[auto] sync teams"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  sync-ranked:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y --silent && npm install node-fetch@2 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync-ranked.js
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Commit et push (ranked)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm --cached ranked_history.json ranked_2v2_history.json 2>/dev/null || true
          for f in ranked.json ranked.json.gz ranked_history.json.gz ranked_2v2_history.json.gz; do [ -f "$f" ] && git add "$f" -f; done
          git diff --cached --quiet && { echo "no changes ranked"; exit 0; }
          git commit -m "[auto] sync ranked"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  sync-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y --silent && npm install node-fetch@2 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync-dashboard.js
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Commit et push (dashboard)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in dashboard_scores.json dashboard_scores.json.gz dashboard_scores_history.json dashboard_scores_history.json.gz; do [ -f "$f" ] && git add "$f" -f; done
          git diff --cached --quiet && { echo "no changes dashboard"; exit 0; }
          git commit -m "[auto] sync dashboard scores"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  sync-player-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10  # ⚡ réduit de 30 à 10 min pour pas bloquer le cycle
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Detect new players from Firebase
        run: node detect-new-players.js || true
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Sync player games
        run: node sync-player-games.js
        env:
          SKAILEX_ACCESS_TOKEN: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Compute player stats
        run: node compute-player-stats.js
      - name: Commit et push (player games + stats)
        run: |
          rm -rf node_modules package.json package-lock.json 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync-players.json player-data/*.json player-stats/*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "no changes player games"; exit 0; }
          git commit -m "[auto] sync player games + stats"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 3))
          done

  retrigger:
    needs: [sync-standard, sync-compact, sync-teams, sync-ranked, sync-dashboard, sync-player-games]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retrigger self (continuous loop)
        run: |
          echo "🔄 Re-déclenchement du workflow (les 6 syncs terminés)."
          gh workflow run sync.yml \
            --repo ${{ github.repository }} \
            --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
