name: Sync Player Games

# ─────────────────────────────────────────────────────────────────────────────
# Sync continue des parties par joueur + calcul des stats pré-calculées.
#
# Étapes:
#   1. detect-new-players.js: détecte les nouveaux joueurs depuis Firebase
#      public-aliases, les ajoute à sync-players.json
#   2. sync-player-games.js: sync les parties (full ou incremental)
#   3. compute-player-stats.js: calcule toutes les stats, écrit player-stats/<pid>.json
#
# Boucle continue via self-retrigger (comme sync.yml).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      player-public-id:
        description: "Public ID d'un joueur à sync (ex: tqMGOI2Q). Vide = tous les joueurs"
        required: false
        type: string
      force-full:
        description: "Forcer une sync complète (ignore le cache)"
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-player-games
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect new players from Firebase
        run: |
          echo "[workflow] Detecting new players..."
          node detect-new-players.js || true

      - name: Sync player games
        run: |
          ARGS=""
          if [ -n "${{ inputs.player-public-id }}" ]; then
            ARGS="${{ inputs.player-public-id }}"
          fi
          if [ "${{ inputs.force-full }}" = "true" ]; then
            ARGS="--full $ARGS"
          fi
          echo "[workflow] Running: node sync-player-games.js $ARGS"
          node sync-player-games.js $ARGS
        env:
          SKAILEX_ACCESS_TOKEN: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}

      - name: Compute player stats
        run: |
          echo "[workflow] Computing pre-calculated stats..."
          if [ -n "${{ inputs.player-public-id }}" ]; then
            node compute-player-stats.js ${{ inputs.player-public-id }}
          else
            node compute-player-stats.js
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sync-players.json player-data/*.json player-stats/*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "[workflow] No changes"; exit 0; }
          git commit -m "[auto] sync player games + stats"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && echo "[workflow] Pushed!" && exit 0
            echo "[workflow] Retrying push ($i)..."
            sleep 5
          done
          echo "[workflow] Failed to push after 5 attempts"

  retrigger:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      actions: write
    if: always()
    steps:
      - name: Retrigger (continuous loop)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            if (context.eventName === 'workflow_dispatch') {
              console.log('Manual dispatch — not retriggering');
              return;
            }
            console.log('Auto-retriggering sync-player-games workflow');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sync-player-games.yml',
              ref: 'main'
            });
