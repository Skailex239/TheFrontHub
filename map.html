<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title id="dynamic-title">TheFrontHub — Leaderboard Carte OpenFront</title>
<meta name="description" id="dynamic-desc" content="Classement speedrun de cette carte OpenFront.io — Meilleurs temps, records et top joueurs.">
<meta property="og:title" content="TheFrontHub — Leaderboard Carte OpenFront" id="dynamic-og-title">
<meta property="og:description" content="Top speeds et records sur cette carte" id="dynamic-og-desc">
<meta property="og:image" content="https://skailex239.github.io/TheFrontHub/logo-new.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" href="runs_public.json.gz" as="fetch" crossorigin>
<link rel="icon" type="image/png" href="favicon-new.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-new.png">
<link rel="stylesheet" href="styles.css?v=19">
<link rel="stylesheet" href="auth.css?v=14">
<link rel="stylesheet" href="animations.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="animations.css"></noscript>
<link rel="stylesheet" href="toast.css">
<script type="module" src="icons.js"></script>
<style>
  .map-hero { background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;box-shadow:var(--shadow-sm) }
  .map-hero h2 { font-size:28px;font-weight:800;margin:0 0 4px;background:var(--text-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text }
  .map-meta { display:flex;gap:20px;flex-wrap:wrap;margin-top:8px }
  .map-meta-item { font-size:13px;color:var(--muted) }
  .map-meta-item strong { color:var(--text);font-weight:600 }
</style>
</head>
<body>
<div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>

<div class="app">
  <aside class="sidebar">
    <div class="logo"><img src="logo-new.png" alt="TheFrontHub" loading="eager"></div>
    <nav>
      <a class="nav-item tab-btn" href="index.html"><i data-icon="home"></i> Tableau de bord</a>
      <a class="nav-item tab-btn" href="speedruns.html"><i data-icon="trophy"></i> Speedruns</a>
      <a class="nav-item tab-btn" href="ranked.html"><i data-icon="swords"></i> Classé (1v1)</a>
      <a class="nav-item tab-btn" href="stats.html"><i data-icon="chart"></i> Statistiques</a>
      <a class="nav-item tab-btn" href="tournaments.html"><i data-icon="trophy"></i> Tournois</a>
      <a class="nav-item tab-btn" href="profile.html"><i data-icon="user"></i> Mon Profil</a>
    </nav>
    <div class="sidebar-profile">
      <div class="auth-zone"><button class="login-btn login-btn-sidebar" onclick="window.location.href='profile.html'">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Connexion</span>
      </button></div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div>
        <h1 id="page-title">Carte</h1>
        <p id="page-subtitle">Leaderboard speedrun</p>
      </div>
    </div>

    <div id="map-content">
      <div class="loading">Chargement du leaderboard...</div>
    </div>
  </main>
</div>

<script src="i18n.js"></script>
<script src="toast.js" defer></script>
<script src="animations.js" defer></script>
<script src="app.js?v=27" type="module"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const mapName = params.get('map') || params.get('name');

  if (!mapName) {
    document.getElementById('map-content').innerHTML = '<div class="empty-state"><h3>Aucune carte spécifiée</h3><p>Ajoutez <code>?map=Africa</code> à l\'URL.</p><a href="speedruns.html" style="color:var(--orange)">← Voir toutes les cartes</a></div>';
    return;
  }

  // Wait for app.js to load data
  let attempts = 0;
  while (!window.allMaps && attempts < 50) {
    await new Promise(r => setTimeout(r, 200));
    attempts++;
  }

  if (!window.allMaps) {
    document.getElementById('map-content').innerHTML = '<div class="empty-state"><h3>Erreur de chargement</h3><p>Impossible de charger les données.</p></div>';
    return;
  }

  // Find the map
  const mapData = window.allMaps.find(m => m.map === mapName || m.map.toLowerCase() === mapName.toLowerCase());

  if (!mapData) {
    // Suggest similar maps
    const similar = window.allMaps.filter(m => m.map.toLowerCase().includes(mapName.toLowerCase())).slice(0, 5);
    let suggestHtml = '';
    if (similar.length > 0) {
      suggestHtml = '<p style="margin-top:12px">Cartes similaires :</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
      for (const s of similar) {
        suggestHtml += `<a href="map.html?map=${encodeURIComponent(s.map)}" style="padding:6px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);text-decoration:none;font-size:13px;transition:all var(--duration) var(--ease-out)">${esc(s.map)}</a>`;
      }
      suggestHtml += '</div>';
    }
    document.getElementById('map-content').innerHTML = `<div class="empty-state"><h3>Carte introuvable</h3><p>"${esc(mapName)}" n'existe pas dans la base de données.</p>${suggestHtml}<a href="speedruns.html" style="color:var(--orange);display:block;margin-top:16px">← Voir toutes les cartes</a></div>`;
    return;
  }

  const best = mapData.runs[0];
  const bestTime = best ? formatTime(best.duration_s) : '—';

  // Update SEO
  const title = `${mapData.map} — Leaderboard Speedrun OpenFront | TheFrontHub`;
  document.title = title;
  document.getElementById('dynamic-title').textContent = title;
  document.getElementById('dynamic-desc').setAttribute('content', `Classement speedrun de ${mapData.map} sur OpenFront : ${mapData.total} parties, meilleur temps ${bestTime}, ${mapData.runs.length} joueurs classés.`);
  document.getElementById('page-title').textContent = mapData.map;
  document.getElementById('page-subtitle').textContent = `${mapData.total} parties · Meilleur : ${bestTime}`;

  let html = `
    <div class="map-hero">
      <h2>${esc(mapData.map)}</h2>
      <div class="map-meta">
        <div class="map-meta-item"><strong>${mapData.total}</strong> parties</div>
        <div class="map-meta-item">Meilleur : <strong>${bestTime}</strong></div>
        <div class="map-meta-item"><strong>${mapData.runs.length}</strong> joueurs classés</div>
        ${mapData.king ? `<div class="map-meta-item">👑 <strong>${esc(mapData.king)}</strong></div>` : ''}
      </div>
    </div>

    <div class="feed-card">
      <div class="feed-header">
        <i data-icon="trophy"></i> Classement — ${esc(mapData.map)}
        <button class="share-btn" onclick="shareMap('${esc(mapData.map)}')" style="float:right">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Partager
        </button>
      </div>
      <div style="padding:0">
  `;

  mapData.runs.forEach((r, i) => {
    const gap = i > 0 ? '+' + formatTime(r.duration_s - mapData.runs[0].duration_s) : '';
    const rc = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const diff = r.difficulty ? `<span style="font-size:10px;color:var(--dim);margin-left:6px">${esc(r.difficulty)}</span>` : '';
    const isNew = (Date.now() - new Date(r.timestamp).getTime()) < 3600000 ? '<span style="font-size:9px;background:var(--orange);color:#fff;padding:1px 5px;border-radius:var(--radius-sm);font-weight:700;margin-left:6px">NEW</span>' : '';
    const rowBg = i === 0 ? 'background:var(--gold-gradient)' : i % 2 === 0 ? '' : 'background:var(--bg)';

    html += `
      <div style="display:grid;grid-template-columns:50px 1fr 100px 80px 40px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-light);${rowBg};transition:background var(--duration) var(--ease-out)" 
           onmouseover="this.style.background='var(--card-hover)'" onmouseout="this.style.background='${i === 0 ? 'var(--gold-gradient)' : i % 2 === 0 ? '' : 'var(--bg)'}'">
        <div style="font-family:var(--mono);font-weight:700;font-size:14px;color:${rc === 'gold' ? 'var(--gold)' : rc === 'silver' ? 'var(--silver)' : rc === 'bronze' ? 'var(--bronze)' : 'var(--muted)'}">${i + 1}</div>
        <div>
          <a href="player.html?name=${encodeURIComponent(r.player)}" style="font-weight:500;font-size:14px;color:var(--text);text-decoration:none;transition:color var(--duration) ease" onmouseover="this.style.color='var(--orange)'" onmouseout="this.style.color='var(--text)'">${esc(r.player)}</a>
          ${diff}${isNew}
        </div>
        <div style="font-family:var(--mono);font-weight:700;font-size:14px;text-align:right">${formatTime(r.duration_s)}</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right">${gap}</div>
        <a class="run-replay" href="${r.url || 'https://openfront.io/game/' + r.id}" target="_blank" title="Replay">▶</a>
      </div>
    `;
  });

  html += '</div></div>';

  document.getElementById('map-content').innerHTML = html;
  if (typeof window.refreshIcons === 'function') window.refreshIcons();
})();

function formatTime(s) { const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shareMap(name) {
  const url = window.location.origin + '/map.html?map=' + encodeURIComponent(name);
  navigator.clipboard.writeText(url).then(() => {
    if (typeof showToast === 'function') showToast('Lien copié !', 'success', 2000);
  });
}
</script>
</body>
</html>
