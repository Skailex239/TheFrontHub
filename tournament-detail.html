<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TheFrontHub — Détail Tournoi</title>
<meta name="description" content="Détail et résultats d'un tournoi OpenFront.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon-new.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-new.png">
<link rel="stylesheet" href="styles.css?v=19">
<link rel="stylesheet" href="auth.css?v=14">
<link rel="stylesheet" href="animations.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="animations.css"></noscript>
<link rel="stylesheet" href="toast.css">
<script type="module" src="icons.js"></script>
</head>
<body>
<div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>

<div class="app">

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <div class="logo">
      <img src="logo-new.png" alt="TheFrontHub" loading="eager">
    </div>

    <nav>
      <a class="nav-item tab-btn" href="speedruns.html">
        <i data-icon="trophy"></i> Speedruns
      </a>
      <a class="nav-item tab-btn" href="ranked.html">
        <i data-icon="swords"></i> Classé (1v1)
      </a>
      <a class="nav-item tab-btn" href="stats.html">
        <i data-icon="chart"></i> Statistiques
      </a>
      <a class="nav-item tab-btn active" href="tournaments.html">
        <i data-icon="trophy"></i> Tournois
      </a>
      <a class="nav-item tab-btn" href="profile.html">
        <i data-icon="user"></i> Mon Profil
      </a>
    </nav>

    <div class="sidebar-profile">
      <div class="auth-zone" id="auth-zone">
        <button class="login-btn login-btn-sidebar" onclick="toggleAuthModal()" id="login-btn-main">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Connexion</span>
        </button>
      </div>
      <div class="user-container" id="user-container" style="display: none;">
        <div class="user-badge" id="user-badge-btn" onclick="toggleUserDropdown(event)">
          <div class="profile-avatar" id="sidebar-avatar">—</div>
          <div class="profile-info">
            <h4 id="user-display-name">—</h4>
            <span>En ligne</span>
          </div>
        </div>
        <div class="user-dropdown-menu" id="user-dropdown-menu">
          <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdown-avatar"></div>
            <div class="dropdown-user-info">
              <div class="dropdown-username" id="dropdown-username-display">—</div>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" onclick="window.location.href='profile.html'">
            <i data-icon="user"></i> Mon profil
          </button>
          <button class="dropdown-item logout" onclick="handleLogout(event)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Se déconnecter
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="content">

    <div class="topbar">
      <div>
        <h1 id="tournament-title">Tournoi</h1>
        <p id="tournament-subtitle">Chargement...</p>
      </div>
    </div>

    <div id="tournament-detail-content">
      <div class="loading">Chargement du tournoi...</div>
    </div>

  </main>
</div>

<!-- Player Modal -->
<div class="modal-overlay" id="player-modal" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div class="modal-header">
      <div class="modal-title" id="modal-player-name">Joueur</div>
      <div class="modal-subtitle" id="modal-player-stats">0 PR · 0 tournois</div>
    </div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-value" id="modal-wins">0</div><div class="modal-stat-label">Victoires</div></div>
      <div class="modal-stat"><div class="modal-stat-value" id="modal-maps">0</div><div class="modal-stat-label">Podiums</div></div>
      <div class="modal-stat"><div class="modal-stat-value" id="modal-avg">—</div><div class="modal-stat-label">Place moy.</div></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">Historique des tournois</div>
      <div class="player-runs" id="modal-runs"></div>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="toast.js" defer></script>
<script src="animations.js" defer></script>
<script src="tournaments.js" type="module"></script>
<script>
  (async () => {
    await window.loadTournamentData();
    await window.renderTournamentDetail();

    // Update topbar with tournament info
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    if (slug && window._tournaments) {
      const t = window._tournaments?.find?.(t => t.slug === slug);
      // Use the data from tournaments.js internal state
    }
  })();

  function closeModal(e) {
    if (!e || e.target.id === 'player-modal') {
      document.getElementById('player-modal')?.classList.remove('active');
    }
  }

  function toggleAuthModal() {
    document.getElementById('auth-modal')?.classList.toggle('active');
  }

  function handleLogout(event) {
    if (event) event.stopPropagation();
    if (confirm('Voulez-vous vous déconnecter ?')) {
      window.logout?.();
    }
  }

  function toggleUserDropdown(event) {
    if (event) event.stopPropagation();
    document.getElementById('user-container')?.classList.toggle('open');
  }
</script>
</body>
</html>
