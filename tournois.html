<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TheFrontHub — Tournois & Power Ranking</title>
<meta name="description" content="Classement Power Ranking des tournois OpenFront — circuit compétitif, profils joueurs et calendrier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon-32x32.png">
<link rel="stylesheet" href="styles.css?v=56">
<link rel="stylesheet" href="tournois.css?v=10">
<link rel="stylesheet" href="animations.css?v=6">
<style>.skip-link{position:absolute;top:-40px;left:0;background:var(--orange,#ef6c00);color:#fff;padding:8px 16px;z-index:10000;transition:top .2s}.skip-link:focus{top:0}</style>
<script type="module" src="dist/icons.min.js?v=2"></script>
<script type="module" src="dist/tournois-icons.min.js?v=1"></script>
</head>
<body class="tournois-page">
<a href="#tournois-content" class="skip-link">Aller au contenu principal</a>
<div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar"></div></div>

<div class="app">

  <!-- ═══ SIDEBAR TheFrontHub (nav principale : 4 onglets, SANS sous-nav) ═══ -->
  <aside class="sidebar">

    <div class="logo" onclick="logoClickAnim(event)" role="link" aria-label="Aller au tableau de bord" tabindex="0">
      <img src="TheFrontHub Logo Text.png" alt="TheFrontHub" loading="eager">
    </div>

    <nav role="tablist">
      <a class="nav-item tab-btn" id="tab-btn-dashboard" href="dashboard.html">
        <i data-icon="home"></i> Tableau de bord
      </a>
      <a class="nav-item tab-btn" id="tab-btn-maps" href="index.html">
        <i data-icon="trophy"></i> Speedruns
      </a>
      <a class="nav-item tab-btn" id="tab-btn-ranked" href="index.html?tab=ranked">
        <i data-icon="swords"></i> Classé
      </a>
      <a class="nav-item tab-btn" id="tab-btn-lobby" href="lobby.html" role="tab" aria-selected="false" tabindex="0">
        <i data-icon="bolt"></i> Lobby
      </a>
      <a class="nav-item tab-btn" id="tab-btn-atlas" href="atlas.html" role="tab" aria-selected="false" tabindex="0">
        <i data-icon="map"></i> Atlas
      </a>
      <a class="nav-item tab-btn active" id="tab-btn-tournois" role="tab" aria-selected="true">
        <i data-icon="medal"></i> Tournois
      </a>
      <a class="nav-item tab-btn" id="tab-btn-profile" href="profile.html">
        <i data-icon="user"></i> Mon Profil
      </a>
    </nav>

    <!-- Theme toggle (light/dark/auto) -->
    <button class="theme-toggle" onclick="toggleTheme()" title="Changer de thème" aria-label="Basculer thème clair/sombre">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>

  </aside>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="content" id="tournois-content">

    <!-- Top-nav horizontale PR-Front (desktop) + menu hamburger (mobile) -->
    <header class="prf-topnav">
      <nav class="prf-topnav-links" id="prf-topnav-links" role="tablist">
        <button class="prf-topnav-link active" data-route="home" role="tab" aria-selected="true">
          <i data-prf-icon="home" data-prf-icon-size="18"></i> Accueil
        </button>
        <button class="prf-topnav-link" data-route="ranking" role="tab" aria-selected="false">
          <i data-prf-icon="trophy" data-prf-icon-size="18"></i> Classement PR
        </button>
        <button class="prf-topnav-link" data-route="tournaments" role="tab" aria-selected="false">
          <i data-prf-icon="shield" data-prf-icon-size="18"></i> Tournois
        </button>
        <button class="prf-topnav-link" data-route="calendar" role="tab" aria-selected="false">
          <i data-prf-icon="calendar" data-prf-icon-size="18"></i> Calendrier
        </button>
      </nav>

      <button class="prf-menu-toggle" id="prf-menu-toggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="prf-drawer">
        <i data-prf-icon="menu" data-prf-icon-size="22"></i>
      </button>

      <a class="prf-play-btn" href="https://openfront.io" target="_blank" rel="noreferrer" style="margin-left:12px">
        <i data-prf-icon="play" data-prf-icon-size="14"></i> Jouer
      </a>
    </header>

    <!-- En-tête de page (titre + sous-titre, peuplé dynamiquement) -->
    <div class="prf-page-head" id="tournois-page-head" style="padding:24px 24px 0;max-width:1280px;margin:0 auto">
      <h1 class="prf-page-title" id="tournois-title">Tournois</h1>
      <p class="prf-page-sub" id="tournois-subtitle">Power Ranking · Circuit compétitif OpenFront</p>
      <div id="tournois-count"></div>
    </div>

    <!-- Fil d'ariane / retour (visible sur les vues détaillées) -->
    <div style="max-width:1280px;margin:0 auto;padding:0 24px">
      <div class="prf-breadcrumb" id="tournois-breadcrumb" style="display:none">
        <button class="prf-breadcrumb-back" id="breadcrumb-back">
          <i data-prf-icon="arrowLeft" data-prf-icon-size="14"></i> Retour
        </button>
        <span class="prf-breadcrumb-path" id="breadcrumb-path"></span>
      </div>
    </div>

    <!-- Zone de rendu des vues (style PR-Front) -->
    <section class="prf-view" id="tournois-view">
      <div class="prf-loading">
        <div class="spinner"></div>
        <p>Chargement des données tournoi…</p>
      </div>
    </section>

  </main>

</div>

<!-- ═══ Tiroir mobile (sub-nav pour téléphone) ═══ -->
<div class="prf-drawer-overlay" id="prf-drawer-overlay"></div>
<aside class="prf-drawer" id="prf-drawer" role="dialog" aria-modal="true" aria-label="Navigation Tournois">
  <div class="prf-drawer-header">
    <span class="prf-drawer-title">Tournois & PR</span>
    <button class="prf-drawer-close" id="prf-drawer-close" aria-label="Fermer le menu">
      <i data-prf-icon="close" data-prf-icon-size="22"></i>
    </button>
  </div>
  <nav class="prf-drawer-nav">
    <button class="prf-drawer-link active" data-route="home">
      <i data-prf-icon="home" data-prf-icon-size="20"></i> Accueil
    </button>
    <button class="prf-drawer-link" data-route="ranking">
      <i data-prf-icon="trophy" data-prf-icon-size="20"></i> Classement PR
    </button>
    <button class="prf-drawer-link" data-route="tournaments">
      <i data-prf-icon="shield" data-prf-icon-size="20"></i> Tournois
    </button>
    <button class="prf-drawer-link" data-route="calendar">
      <i data-prf-icon="calendar" data-prf-icon-size="20"></i> Calendrier
    </button>
  </nav>
</aside>

<script type="module" src="dist/tournois.min.js?v=1"></script>
<script src="dist/lenis.min.js?v=1"></script>
<script src="dist/animations.min.js?v=1"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js?v=9').catch(e => console.warn('[SW] Registration failed:', e));
    });
  }
</script>
</body>
</html>
